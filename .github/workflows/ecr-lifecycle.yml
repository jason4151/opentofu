name: ECR Lifecycle

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select the action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - refresh
          - destroy
  workflow_call:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: string
        default: 'plan'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  TOFU_VERSION: 1.12.6
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_KEY: ecr/terraform.tfstate
  TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}

jobs:
  ecr-lifecycle:
    name: ECR Lifecycle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecr
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Annotate Workflow Run Details
        run: |
          ACTION="${{ inputs.action }}"
          echo "::notice title=Workflow Action::Action: $ACTION, Branch: ${{ github.ref_name }}"
          echo "::notice title=Workflow Start Time::Started: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "::notice title=Commit SHA::Commit: ${{ github.sha }}"
          echo "::notice title=OpenTofu Version::OpenTofu Version: ${{ env.TOFU_VERSION }}"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: Cache OpenTofu Providers
        uses: actions/cache@v5
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}-providers-${{ hashFiles('ecr/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-tofu-${{ env.TOFU_VERSION }}-providers-
      - name: OpenTofu Init
        run: |
          export TF_PLUGIN_CACHE_DIR=~/.terraform.d/plugin-cache
          tofu init -backend-config="bucket=$TF_STATE_BUCKET" \
                    -backend-config="key=$TF_STATE_KEY" \
                    -backend-config="region=$AWS_REGION" \
                    -backend-config="dynamodb_table=$TF_LOCK_TABLE"
      - name: OpenTofu Validate
        run: tofu validate
      - name: OpenTofu Plan
        id: plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          tofu plan -out=tfplan -no-color
          echo "Plan generated at tfplan"
      - name: OpenTofu Apply
        if: inputs.action == 'apply' && steps.plan.outcome == 'success'
        run: tofu apply -no-color -auto-approve tfplan
      - name: OpenTofu Refresh
        if: inputs.action == 'refresh'
        run: tofu refresh -no-color
      - name: OpenTofu Destroy
        if: inputs.action == 'destroy'
        run: tofu destroy -no-color -auto-approve
      - name: Cleanup
        if: always() && (inputs.action == 'plan' || inputs.action == 'apply')
        run: rm -f tfplan